spring.application.name=event-service
server.port=${PORT:8081}

# MongoDB - Event Service has its own database
spring.data.mongodb.uri=${MONGO_URI:mongodb://root:password@localhost:27017/events-db?authSource=admin}

# JWT (must match the Auth Service secret)
jwt.secret=${JWT_SECRET:dev-super-secret-key-32-chars-minimum-1234}
jwt.expiration=${JWT_EXPIRATION:28800000}

# Eureka Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Feign resolves service names via Eureka - no hardcoded URLs needed
