input {
  tcp {
    port => 5000
    codec => json_lines
  }
  udp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [message] {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }

  # Add service name tag if not present
  if ![service] and [spring.application.name] {
    mutate {
      add_field => { "service" => "%{[spring.application.name]}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "calendario-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
