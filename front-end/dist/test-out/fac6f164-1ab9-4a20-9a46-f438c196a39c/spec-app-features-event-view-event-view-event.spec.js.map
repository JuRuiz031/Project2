<header class="app-navbar navbar" role="banner">
  <div class="container-fluid px-3 py-2">
    <span class="navbar-brand mb-0 h1">CalendarIO</span>

    <div class="d-flex align-items-center gap-2">
      <span class="text-white me-2">Enjoying CalendarIO?</span>
      <a class="btn btn-outline-light btn-sm" routerLink="/create-account">
        Create account here
      </a>
    </div>
  </div>
</header>

<div class="container py-4 app-page">
  <h1 class="h3 mb-3">Event Details</h1>

  <div class="card app-card shadow-sm">
    <div class="card-body">
      @if (apiError()) {
        <div class="alert alert-danger mb-3">
          {{ apiError() }}
        </div>
      }

      @if (isLoading()) {
        <div class="alert alert-info">Loading event...</div>
      }

      @if (!isLoading() && !apiError()) {
        <div [formGroup]="form">
          <!-- Title -->
          <div class="mb-3">
            <label class="form-label">Event Title</label>
            <input
              type="text"
              class="form-control app-input"
              formControlName="title"
            />
          </div>

          <!-- Dates / times -->
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Start date</label>
              <input
                type="date"
                class="form-control app-input"
                formControlName="startDate"
              />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label">Start time ({{ getTimezoneAbbr() }})</label>
              <input
                type="time"
                class="form-control app-input"
                formControlName="startTime"
              />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label">End date</label>
              <input
                type="date"
                class="form-control app-input"
                formControlName="endDate"
              />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label">End time ({{ getTimezoneAbbr() }})</label>
              <input
                type="time"
                class="form-control app-input"
                formControlName="endTime"
              />
            </div>
          </div>

          <!-- Description -->
          <div class="mt-3 mb-3">
            <label class="form-label">Description</label>
            <textarea
              rows="4"
              class="form-control app-textarea"
              formControlName="description"
            ></textarea>
          </div>

          <!-- Notes -->
          <div class="mb-2">
            <label class="form-label">Notes</label>
            <textarea
              rows="4"
              class="form-control app-textarea"
              formControlName="notes"
            ></textarea>
          </div>
        </div>
      }
    </div>
  </div>
</div>

<app-main-footer></app-main-footer>
