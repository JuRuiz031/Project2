<div class="container py-4 app-page">
  <h1 class="h3 mb-3">Delete Profile</h1>

  <div class="card app-card shadow-sm">
    <div class="card-body">
      <div class="delete-user__message">
        Are you sure you want to delete your profile
        <strong>"{{ userName() }}"</strong>?
        <br />
        <span class="text-muted">This action cannot be undone.</span>
      </div>

      @if (apiError()) {
        <div class="alert alert-danger mt-3 mb-0">
          {{ apiError() }}
        </div>
      }
    </div>

    <div class="card-footer d-flex justify-content-center gap-5">
      <button
        type="button"
        class="btn btn-danger"
        (click)="confirmDelete()"
        [disabled]="isDeleting()"
      >
        @if (isDeleting()) { Deleting... } @else { Confirm }
      </button>

      <button
        type="button"
        class="btn btn-outline-light"
        (click)="cancelDelete()"
        [disabled]="isDeleting()"
      >
        Cancel
      </button>

    </div>
  </div>
</div>
