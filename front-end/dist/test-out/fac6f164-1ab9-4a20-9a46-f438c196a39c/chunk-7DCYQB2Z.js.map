<section class="polls-window" aria-label="Polls Window">
  <h2 class="polls-window__title">Polls Window</h2>

  <div class="polls-window__panel">
    @if (polls().length === 0) {
      <div class="polls-window__placeholder">
        No polls yet.
      </div>
    } @else {
      <ul class="list-group">
        @for (p of polls(); track p.poll_id) {
          <li
            class="list-group-item d-flex justify-content-between align-items-center"
            (click)="onSelectPoll(p)"
            (dblclick)="onDoubleClickPoll(p)"
            [class.active]="p.poll_id === selectedPollId()"
            style="cursor: pointer;"
            title="Double-click to view poll"
          >
            <span>{{ p.title }}</span>
            <small class="text-muted">{{ formatPollTime(p.start_time) }} ({{ getTimezoneAbbr() }})</small>
          </li>
        }
      </ul>
    }
  </div>

  <div class="polls-window__actions">
    <button type="button" class="polls-window__btn" (click)="onCreatePoll()">
      Create Poll
    </button>

    <button type="button" class="polls-window__btn" (click)="onViewPolls()">
      View Polls
    </button>
  </div>
</section>
