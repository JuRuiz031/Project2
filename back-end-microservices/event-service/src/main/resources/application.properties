spring.application.name=event-service
server.port=${PORT:8084}

# MongoDB - Event Service has its own database
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/calendario-events}

# JWT (must use the same secret across ALL services)
jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-this-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Eureka Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Feign resolves service names via Eureka - no hardcoded URLs needed
