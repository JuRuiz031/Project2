spring.application.name=calendar-service
server.port=${PORT:8083}

spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/calendario-calendars}

jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-this-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

app.calendar.invite.base-url=${INVITE_BASE_URL:http://localhost:4200/invite}
