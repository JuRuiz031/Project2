spring.application.name=api-gateway
server.port=${PORT:8080}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT (same secret as all services)
jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-this-in-production}

# Route: Auth Service (public - no JWT required)
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/login/**

# Route: User Service
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/users/**

# Route: Calendar Service
spring.cloud.gateway.server.webflux.routes[2].id=calendar-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://calendar-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/calendars/**

# Route: Event Service
spring.cloud.gateway.server.webflux.routes[3].id=event-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://event-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/events/**

# Route: Poll Service
spring.cloud.gateway.server.webflux.routes[4].id=poll-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://poll-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/polls/**

# Route: Invite Link Generation (authenticated - goes to Event Service)
spring.cloud.gateway.server.webflux.routes[5].id=invite-create
spring.cloud.gateway.server.webflux.routes[5].uri=lb://event-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/invite/**

# Route: Invite Link Resolution (public - goes to Event Service)
spring.cloud.gateway.server.webflux.routes[6].id=invite-resolve
spring.cloud.gateway.server.webflux.routes[6].uri=lb://event-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/invitelink/**

# Route: Calendar BFF (singular /calendar path for frontend composite endpoint)
spring.cloud.gateway.server.webflux.routes[7].id=calendar-bff
spring.cloud.gateway.server.webflux.routes[7].uri=lb://calendar-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/v1/calendar,/api/v1/calendar/**

# CORS is handled by CorsConfig.java (CorsWebFilter bean)
# Deduplicate CORS headers if downstream services also add them
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
